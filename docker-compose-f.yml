---
version: "2"
x-redash-service: &redash-service
  image: asia-south1-docker.pkg.dev/prod-data-platform/redash/redash-v9:7
  env_file: /opt/redash/env
  restart: always
  logging:
    driver: "local"
services:
  server:
    <<: *redash-service
    command: server
    container_name: redash
    expose:
      - 5000
      - 5678
    environment:
      PYTHONUNBUFFERED: 0
      REDASH_WEB_WORKERS: 5
    mem_limit: 7516192768
  scheduler:
    <<: *redash-service
    command: scheduler
    environment:
      PYTHONUNBUFFERED: 0
    mem_limit: 7516192768
  scheduled_worker:
    <<: *redash-service
    command: worker
    depends_on:
      - server
    environment:
      PYTHONUNBUFFERED: 0
    mem_limit: 7516192768
  adhoc_worker:
    <<: *redash-service
    command: worker
    depends_on:
      - server
    mem_limit: 7516192768
  adhoc_worker2:
    <<: *redash-service
    command: worker
    depends_on:
      - server
    mem_limit: 7516192768
