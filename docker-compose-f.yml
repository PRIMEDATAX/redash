  nginx:
    image: nginx:latest
    volumes:
      - /opt/redash/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/certs:/etc/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    links:
      - server:redash
